apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  labels: {{- include "agent.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {{- include "agent.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "agent.selector" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ add .Values.agent.deadlineSeconds 15 }}  # let in-flight runs finish
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "agent.selector" . | nindent 14 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: AGENT_MODEL, value: {{ .Values.agent.model | quote }}}
            - {name: LLM_BASE_URL, value: {{ .Values.agent.llmBaseUrl | quote }}}
            - {name: AGENT_MAX_STEPS, value: {{ .Values.agent.maxSteps | quote }}}
            - {name: AGENT_MAX_COST_USD, value: {{ .Values.agent.maxCostUsd | quote }}}
            - {name: AGENT_DEADLINE_S, value: {{ .Values.agent.deadlineSeconds | quote }}}
            - {name: AGENT_RUN_LOG, value: /var/log/agent/runs.jsonl}
            {{- if .Values.otel.endpoint }}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.otel.endpoint | quote }}}
            {{- end }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          lifecycle:
            preStop:
              exec: {command: ["sleep", "10"]}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: runlog, mountPath: /var/log/agent}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: runlog, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
