{{- if .Values.ollama.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
  labels: {app.kubernetes.io/name: ollama, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  serviceName: ollama
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ollama}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ollama}
    spec:
      nodeSelector: {{- toYaml .Values.ollama.nodeSelector | nindent 8 }}
      tolerations:
        - {key: kubernetes.azure.com/scalesetpriority, operator: Equal, value: spot, effect: NoSchedule}
      initContainers:
        - name: pull-models
          image: {{ .Values.ollama.image }}
          command: ["/bin/sh", "-c"]
          args:
            - ollama serve & sleep 5 && {{- range .Values.ollama.models }} ollama pull {{ . }} && {{- end }} kill %1
          volumeMounts: [{name: models, mountPath: /root/.ollama}]
      containers:
        - name: ollama
          image: {{ .Values.ollama.image }}
          ports: [{name: http, containerPort: 11434}]
          env:
            - {name: OLLAMA_KEEP_ALIVE, value: "-1"}
            - {name: OLLAMA_NUM_PARALLEL, value: "4"}
          readinessProbe:
            httpGet: {path: /api/tags, port: http}
          resources: {{- toYaml .Values.ollama.resources | nindent 12 }}
          volumeMounts: [{name: models, mountPath: /root/.ollama}]
  volumeClaimTemplates:
    - metadata: {name: models}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  selector: {app.kubernetes.io/name: ollama}
  ports: [{name: http, port: 11434, targetPort: http}]
{{- end }}
