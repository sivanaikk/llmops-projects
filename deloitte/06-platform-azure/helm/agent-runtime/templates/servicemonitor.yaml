{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agent-runtime
  labels: {{- include "agent.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "agent.selector" . | nindent 6 }}
  endpoints:
    - {port: http, path: /metrics, interval: 15s}
{{- end }}
