# Copy to the repo root as .pre-commit-config.yaml, then `pre-commit install`.
# Catches in seconds what CI would catch in minutes.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks: [{id: gitleaks}]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks: [{id: ruff, args: [--fix]}]
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.2
    hooks: [{id: terraform_fmt}]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks: [{id: check-yaml, args: [--allow-multiple-documents], exclude: "helm/.*/templates/"}, {id: detect-private-key}, {id: check-added-large-files}]
