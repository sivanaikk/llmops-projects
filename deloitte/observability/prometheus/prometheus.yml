global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules/agent-alerts.yml
  - /etc/prometheus/rules/slo-generated.yml
scrape_configs:
  - job_name: agent-runtime
    static_configs: [{targets: ["agent:8000"]}]
  - job_name: sentinel
    honor_labels: true
    static_configs: [{targets: ["pushgateway:9091"]}]
