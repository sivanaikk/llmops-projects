# GENERATED by `budgetgate rules` from slos/*.yaml - do not edit.
groups:
    - name: slo-agent-runtime-availability-recording
      interval: 30s
      rules:
        - record: slo:error_ratio:rate5m
          expr: sum(rate(agent_runs_total{outcome=~"llm_unavailable|deadline|invalid_output"}[5m])) / clamp_min(sum(rate(agent_runs_total[5m])), 1e-9)
          labels:
            service: agent-runtime
            slo: availability
        - record: slo:error_ratio:rate30m
          expr: sum(rate(agent_runs_total{outcome=~"llm_unavailable|deadline|invalid_output"}[30m])) / clamp_min(sum(rate(agent_runs_total[30m])), 1e-9)
          labels:
            service: agent-runtime
            slo: availability
        - record: slo:error_ratio:rate1h
          expr: sum(rate(agent_runs_total{outcome=~"llm_unavailable|deadline|invalid_output"}[1h])) / clamp_min(sum(rate(agent_runs_total[1h])), 1e-9)
          labels:
            service: agent-runtime
            slo: availability
        - record: slo:error_ratio:rate6h
          expr: sum(rate(agent_runs_total{outcome=~"llm_unavailable|deadline|invalid_output"}[6h])) / clamp_min(sum(rate(agent_runs_total[6h])), 1e-9)
          labels:
            service: agent-runtime
            slo: availability
        - record: slo:error_ratio:rate1d
          expr: sum(rate(agent_runs_total{outcome=~"llm_unavailable|deadline|invalid_output"}[1d])) / clamp_min(sum(rate(agent_runs_total[1d])), 1e-9)
          labels:
            service: agent-runtime
            slo: availability
        - record: slo:error_ratio:rate3d
          expr: sum(rate(agent_runs_total{outcome=~"llm_unavailable|deadline|invalid_output"}[3d])) / clamp_min(sum(rate(agent_runs_total[3d])), 1e-9)
          labels:
            service: agent-runtime
            slo: availability
        - record: slo:error_ratio:rate28d
          expr: sum(rate(agent_runs_total{outcome=~"llm_unavailable|deadline|invalid_output"}[28d])) / clamp_min(sum(rate(agent_runs_total[28d])), 1e-9)
          labels:
            service: agent-runtime
            slo: availability
        - record: slo:objective
          expr: vector(0.99)
          labels:
            service: agent-runtime
            slo: availability
        - record: slo:error_budget_remaining
          expr: 1 - (slo:error_ratio:rate28d{service="agent-runtime", slo="availability"} / 0.01)
          labels:
            service: agent-runtime
            slo: availability
    - name: slo-agent-runtime-availability-alerts
      rules:
        - alert: SLOFastBurn
          expr: (slo:error_ratio:rate1h{service="agent-runtime", slo="availability"} / 0.01 > 14.4) and (slo:error_ratio:rate5m{service="agent-runtime", slo="availability"} / 0.01 > 14.4)
          for: 2m
          labels:
            service: agent-runtime
            severity: page
            slo: availability
          annotations:
            description: SLO agent-runtime/availability (99% over 28d), owner team-ai-platform
            runbook_url: 08-sre-operations/runbooks/slo-burn.md
            summary: 'agent-runtime burning its error budget 14x: 2% of the budget per hour'
        - alert: SLOSlowBurn
          expr: (slo:error_ratio:rate6h{service="agent-runtime", slo="availability"} / 0.01 > 6) and (slo:error_ratio:rate30m{service="agent-runtime", slo="availability"} / 0.01 > 6)
          for: 15m
          labels:
            service: agent-runtime
            severity: page
            slo: availability
          annotations:
            description: SLO agent-runtime/availability (99% over 28d), owner team-ai-platform
            runbook_url: 08-sre-operations/runbooks/slo-burn.md
            summary: agent-runtime burning its error budget 6x over 6h
        - alert: SLOBudgetLeak
          expr: (slo:error_ratio:rate3d{service="agent-runtime", slo="availability"} / 0.01 > 1) and (slo:error_ratio:rate6h{service="agent-runtime", slo="availability"} / 0.01 > 1)
          for: 1h
          labels:
            service: agent-runtime
            severity: ticket
            slo: availability
          annotations:
            description: SLO agent-runtime/availability (99% over 28d), owner team-ai-platform
            runbook_url: 08-sre-operations/runbooks/slo-burn.md
            summary: agent-runtime is spending budget faster than it accrues (3d)
        - alert: SLOBudgetExhausted
          expr: slo:error_budget_remaining{service="agent-runtime", slo="availability"} <= 0
          for: 5m
          labels:
            service: agent-runtime
            severity: ticket
            slo: availability
          annotations:
            description: SLO agent-runtime/availability (99% over 28d), owner team-ai-platform
            runbook_url: 08-sre-operations/error-budget-policy.md
            summary: 'agent-runtime has no error budget left: release gate is closed'
