server:
  http_listen_port: 9080
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      # Only ship logs from the runtime's own services; keep label set small.
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: gateway|account-intel|ollama-primary|ollama-secondary
        action: keep
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
    pipeline_stages:
      # Never ship raw keys to the log store.
      - replace:
          expression: '(sk-[A-Za-z0-9_-]{8,})'
          replace: 'sk-***'
