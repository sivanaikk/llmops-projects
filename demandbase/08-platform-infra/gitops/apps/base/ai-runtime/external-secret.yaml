# Syncs LITELLM_MASTER_KEY / DATABASE_URL / REDIS_HOST from AWS Secrets Manager
# (created by terraform/data-stores.tf). Assumes a ClusterSecretStore named
# `aws-secrets-manager` backed by an IRSA/pod-identity role.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: llm-gateway
  dataFrom:
    - extract:
        key: ai-runtime-dev/litellm
