apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "65.x"
      sourceRef: {kind: HelmRepository, name: prometheus-community, namespace: flux-system}
  install: {crds: CreateReplace}
  upgrade: {crds: CreateReplace}
  values:
    prometheus:
      prometheusSpec:
        retention: 15d
        # Pick up ServiceMonitors/PrometheusRules from every namespace.
        serviceMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 30m
  chart:
    spec:
      chart: external-secrets
      version: "0.10.x"
      sourceRef: {kind: HelmRepository, name: external-secrets, namespace: flux-system}
  install: {crds: CreateReplace}
